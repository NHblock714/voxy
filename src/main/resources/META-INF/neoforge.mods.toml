loaderVersion="[4,)"
license="All-Rights-Reserved"
issueTrackerURL="https://github.com/NHblock714/voxy/issues"

[[mods]]
modId="voxy"
version="${version}"
displayName="Voxy超远视野"
description="NeoForge Voxy fork (far-distance LOD rendering) with bundled mod integrations: Create (distant trains, tracks, contraptions, kinetic culling), sable contraption LOD, and EclipticSeasons seasonal snow"
authors="Cortex"
credits="Fork maintained by NHblock"
logoFile="assets/voxy/icon.png"

[[dependencies.voxy]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# Architectural dependency, not an enhancement: the LOD draw is dispatched only from sodium's chunk
# renderer hooks, chunk auto-ingest rides its RenderSectionManager, and the bakery uses its colour
# pipeline. Declared required so absence fails on the load screen instead of an NCDFE at world join.
[[dependencies.voxy]]
modId="sodium"
type="required"
versionRange="[0.6.13,)"
ordering="AFTER"
side="CLIENT"


[[dependencies.voxy]]
modId="iris"
type="optional"
versionRange="[1.8.12,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="iris.voxy.mixins.json"

[[mixins]]
config="common.voxy.mixins.json"

